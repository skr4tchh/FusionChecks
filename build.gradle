plugins {
    id 'com.gradleup.shadow' version '8.3.0'
    id 'java'
}

group = 'pw.fusionmine'
version = '1.2'

repositories {
    mavenCentral()
    maven {
        url "https://libraries.minecraft.net"
    }
    maven {
        setName("elytrium-repo")
        setUrl("https://maven.elytrium.net/repo/")
    }
    maven { url = "https://repo.aikar.co/content/groups/aikar/" }
}

dependencies {
    compileOnly("net.md-5:bungeecord-api:1.21-R0.3")
    compileOnly ("org.projectlombok:lombok:1.18.38")
    annotationProcessor ("org.projectlombok:lombok:1.18.38")
    implementation ("co.aikar:acf-bungee:0.5.1-SNAPSHOT")
    implementation ("net.elytrium.commons:config:1.2.5")
}

shadowJar {
    relocate 'co.aikar.commands', 'pw.fusionmine.acf'
    relocate 'co.aikar.locales', 'pw.fusionmine.acf.locales'
    relocate 'net.elytrium.commons.config', 'pw.fusionmine.utils.config'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    expand props
    filteringCharset 'UTF-8'
    filesMatching('bungee.yml') {
        expand props
    }
}

build.dependsOn shadowJar
